version: 2
# Weekly PRs for pinned versions; CI checks each one.
# Not covered: golangci-lint version in .golangci-lint-version — bump by hand.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker # Dockerfile: golang, alpine
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose # docker-compose.yml: mongo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Patches only. A new major or minor release changes the data file format
      # (featureCompatibilityVersion): CI tests on an empty DB stay green, but the
      # existing volume may fail to start. Upgrade MongoDB by hand, step by step.
      - dependency-name: mongo
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions # SHAs in .github/workflows
    directory: /
    schedule:
      interval: weekly
