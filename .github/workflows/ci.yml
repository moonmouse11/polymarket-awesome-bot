name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the outdated run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (tags can be moved); Dependabot bumps them.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Same file the Makefile reads, so local `make lint` and CI use one version.
          version-file: .golangci-lint-version

  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:9.0.2
        env:
          # Throwaway database that lives only for this job: not a secret.
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: ci-root
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_TEST_URI: mongodb://polymarket_test:ci-test@localhost:27017/polymarket_test?authSource=polymarket_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Same least-privilege test user as docker/mongo-init/01-users.js
      # (services start before checkout, so the init script cannot be mounted).
      - name: Create test user
        run: |
          docker exec ${{ job.services.mongodb.id }} mongosh --quiet \
            -u root -p ci-root --authenticationDatabase admin \
            --eval 'db.getSiblingDB("polymarket_test").createUser({user: "polymarket_test", pwd: "ci-test", roles: [{role: "dbOwner", db: "polymarket_test"}]})'
      # CI=true makes DB tests fail instead of skipping when MongoDB is unreachable.
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  # Required check: fails when the SonarQube Cloud quality gate fails (sonar.qualitygate.wait).
  sonar:
    needs: test
    runs-on: ubuntu-latest
    # Fork and Dependabot PRs get no SONAR_TOKEN; skip instead of failing
    # (a skipped job satisfies a required check).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for blame and new-code detection
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image (not pushed)
        run: docker build -t polymarket-bot:ci .
