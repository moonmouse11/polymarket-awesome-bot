sonar.organization=moonmouse11
sonar.projectKey=moonmouse11_polymarket-awesome-bot

sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
# cmd/ is startup wiring (env, os.Exit, signal setup); it has no unit tests by design.
sonar.coverage.exclusions=cmd/**
sonar.qualitygate.wait=true
