sonar.organization=moonmouse11
sonar.projectKey=moonmouse11_polymarket-awesome-bot

sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
# cmd/ and internal/command are startup wiring (env, os.Exit, signal setup);
# they have no unit tests by design.
sonar.coverage.exclusions=cmd/**,internal/command/**
sonar.qualitygate.wait=true
