version: '3.8'

services:
  bot:
    build: .
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - JEV_API_KEY=${JEV_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data:
